<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stuck Task Breaker</title>
  <style>
    :root {
      --sky: #eaf4ff;
      --lavender: #f3edff;
      --mint: #e8fff5;
      --ink: #2f2f4f;
      --muted: #5e6288;
      --sparkle: #7d78ff;
      --sparkle-dark: #6862ee;
      --card: rgba(255, 255, 255, 0.86);
      --border: #d8d7ff;
      --output: #f8faff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, #fff6c5 0, #fff6c5 9%, transparent 10%),
        radial-gradient(circle at 80% 25%, #d8f6ff 0, #d8f6ff 11%, transparent 12%),
        radial-gradient(circle at 70% 80%, #ffe2f2 0, #ffe2f2 10%, transparent 11%),
        linear-gradient(145deg, var(--sky), var(--lavender) 55%, var(--mint));
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .app {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(106, 111, 180, 0.18);
      backdrop-filter: blur(5px);
      padding: 1.4rem;
      position: relative;
      overflow: hidden;
    }

    .app::before,
    .app::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.35;
      z-index: -1;
    }

    .app::before {
      width: 220px;
      height: 220px;
      background: #ffe8f7;
      top: -90px;
      right: -55px;
    }

    .app::after {
      width: 180px;
      height: 180px;
      background: #dcf6ff;
      bottom: -70px;
      left: -60px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      letter-spacing: 0.4px;
    }

    .subtitle {
      margin: 0.65rem 0 1rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .magic {
      display: inline-block;
      transform: rotate(-7deg);
      margin-right: 0.35rem;
    }

    label {
      font-weight: 700;
      display: block;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 0.8rem 0.95rem;
      font-size: 1rem;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    input:focus {
      border-color: #a6a2ff;
      box-shadow: 0 0 0 4px rgba(125, 120, 255, 0.18);
    }

    .actions {
      margin-top: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.68rem 1.2rem;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--sparkle), #8ea3ff);
      box-shadow: 0 10px 20px rgba(98, 107, 255, 0.3);
      transition: transform 0.12s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      background: linear-gradient(135deg, var(--sparkle-dark), #7f96ff);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .output {
      margin-top: 1.2rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--output);
      padding: 0.95rem;
    }

    .output h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.55rem;
    }

    li {
      background: #fff;
      border: 1px solid #ececff;
      border-radius: 12px;
      padding: 0.62rem 0.7rem;
      box-shadow: 0 4px 10px rgba(137, 145, 216, 0.12);
    }

    li::before {
      content: "✨ ";
    }
  </style>
</head>
<body>
  <main class="app">
    <h1><span class="magic">🪄</span>Stuck Task Breaker</h1>
    <p class="subtitle">When your brain says “nope,” grab three tiny moves and steal momentum back.</p>

    <label for="taskInput">What are you stuck on?</label>
    <input id="taskInput" type="text" placeholder="e.g., Start the quarterly report" />

    <div class="actions">
      <button id="unstickBtn" type="button">Unstick Me</button>
      <p class="hint">Tap as many times as you want for fresh nudges.</p>
    </div>

    <section class="output" aria-live="polite">
      <h2>Try one of these:</h2>
      <ul id="suggestionsList">
        <li>Break it into a 5-minute step</li>
        <li>Write the first sentence only</li>
        <li>Set a 10-minute timer</li>
      </ul>
    </section>
  </main>

  <script>
    const suggestions = [
      "Break it into a 5-minute step",
      "Write the first sentence only",
      "Ask someone one clarifying question",
      "Set a 10-minute timer",
      "Do the easiest part first",
      "Rename the task to something smaller",
      "Open the file and just look at it",
      "Decide what \"10% done\" looks like"
    ];

    const listElement = document.getElementById("suggestionsList");
    const button = document.getElementById("unstickBtn");

    function pickThreeRandom(items) {
      const pool = [...items];
      const chosen = [];

      while (chosen.length < 3 && pool.length > 0) {
        const index = Math.floor(Math.random() * pool.length);
        chosen.push(pool.splice(index, 1)[0]);
      }

      return chosen;
    }

    button.addEventListener("click", () => {
      const nextSteps = pickThreeRandom(suggestions);
      listElement.innerHTML = "";

      nextSteps.forEach((step) => {
        const item = document.createElement("li");
        item.textContent = step;
        listElement.appendChild(item);
      });
    });
  </script>
</body>
</html>
